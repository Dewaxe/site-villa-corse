name: M0 private image transfer

on:
  push:
    branches: ['m0/routage-pages']
    paths:
      - '.github/workflows/m0-transfer.yml'
  workflow_dispatch:
    inputs:
      job:
        description: Opaque publication request
        required: false
        type: string

permissions:
  contents: read

jobs:
  transfer:
    if: ${{ vars.M0_TRANSFER_ORIGIN != '' && inputs.job == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Compile locked decoder
        working-directory: prototypes/m0-pages
        run: |
          rustup target add wasm32-unknown-unknown
          CARGO_TARGET_DIR="$PWD/.wrangler/webp-decoder" cargo build --locked --release --target wasm32-unknown-unknown --manifest-path benchmarks/webp-decoder/Cargo.toml
      - name: Fetch and validate fictional image
        working-directory: prototypes/m0-pages
        env:
          TRANSFER_ORIGIN: ${{ vars.M0_TRANSFER_ORIGIN }}
          TRANSFER_TOKEN: ${{ secrets.M0_TRANSFER_TOKEN }}
        run: node benchmarks/image-publication/transfer-check.js

  publication:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.job != '' && vars.M0_PUBLICATION_ORIGIN != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install locked processor
        working-directory: prototypes/m0-pages
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Process requested revision
        working-directory: prototypes/m0-pages
        env:
          PUBLICATION_ORIGIN: ${{ vars.M0_PUBLICATION_ORIGIN }}
          PUBLICATION_TOKEN: ${{ secrets.M0_PUBLICATION_TOKEN }}
          PUBLICATION_JOB: ${{ inputs.job }}
          PUBLICATION_STATIC: ${{ vars.M0_PUBLICATION_STATIC }}
          STATIC_ORIGIN: ${{ vars.M0_STATIC_ORIGIN }}
        run: |
          if [[ "$PUBLICATION_STATIC" == 1 ]]; then
            release=$(node benchmarks/image-publication/github-runner.js)
            printf 'M0_STATIC_RELEASE=%s\n' "$release" >> "$GITHUB_ENV"
          else
            node benchmarks/image-publication/github-runner.js
          fi
      - name: Deploy fictional static preview
        if: ${{ vars.M0_PUBLICATION_STATIC == '1' }}
        working-directory: prototypes/m0-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.M0_STATIC_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.M0_STATIC_ACCOUNT_ID }}
          STATIC_PROJECT: ${{ vars.M0_STATIC_PROJECT }}
          STATIC_ORIGIN: ${{ vars.M0_STATIC_ORIGIN }}
        run: |
          [[ "$STATIC_PROJECT" =~ ^m0-static-[a-z0-9]+$ ]]
          [[ "$STATIC_ORIGIN" == "https://static-test.$STATIC_PROJECT.pages.dev" ]]
          [[ "$M0_STATIC_RELEASE" == "$RUNNER_TEMP"/static-release-* ]]
          wrangler="$PWD/node_modules/wrangler/bin/wrangler.js"
          cd "$M0_STATIC_RELEASE"
          node "$wrangler" pages deploy . --project-name "$STATIC_PROJECT" --branch static-test
      - name: Report static deployment to the prototype
        if: ${{ vars.M0_PUBLICATION_STATIC == '1' }}
        env:
          PUBLICATION_ORIGIN: ${{ vars.M0_PUBLICATION_ORIGIN }}
          PUBLICATION_TOKEN: ${{ secrets.M0_PUBLICATION_TOKEN }}
          PUBLICATION_JOB: ${{ inputs.job }}
        run: |
          [[ "$PUBLICATION_ORIGIN" =~ ^https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev$ ]]
          [[ "$PUBLICATION_JOB" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$M0_STATIC_SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $PUBLICATION_TOKEN" \
            --header "X-Source-SHA256: $M0_STATIC_SOURCE_SHA256" \
            "$PUBLICATION_ORIGIN/internal/publication/$PUBLICATION_JOB/static-deployed")
          [[ "$status" == 204 ]]
