<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Essai local des clés d’accès</title>
  <script src="/client.js" type="module"></script>
</head>
<body>
  <main>
    <h1>Essai local des clés d’accès</h1>
    <label for="account">Compte de démonstration</label>
    <select id="account">
      <option value="demo-a">Compte A</option>
      <option value="demo-b">Compte B</option>
    </select>
    <label for="invite">Invitation locale</label>
    <input id="invite" type="password" autocomplete="off">
    <p><button id="register">Ajouter une clé</button></p>
    <p><button id="login">Se connecter</button></p>
    <p><button id="backup">Ajouter une clé de secours</button></p>
    <p><button id="list">Afficher mes clés</button></p>
    <label for="keys">Clé à révoquer</label>
    <select id="keys"></select>
    <button id="revoke">Révoquer la clé sélectionnée</button>
    <p><button id="logout">Se déconnecter</button></p>
    <p id="status" role="status"></p>
    <section>
      <h2>Article de démonstration</h2>
      <form id="draft-form">
        <p><label>Titre <input name="title" maxlength="120" required></label></p>
        <p><label>Description <input name="description" maxlength="240" required></label></p>
        <p><label>Texte <textarea name="body" maxlength="4000" required></textarea></label></p>
        <p><label>Image <input name="image" type="file" accept="image/*" required></label></p>
        <button id="save-draft" type="button">Enregistrer le brouillon</button>
      </form>
      <p><button id="load-revisions">Actualiser les révisions</button></p>
      <label>Révision <select id="revisions"></select></label>
      <button id="publish">Publier ou restaurer</button>
      <p><a href="/articles/article-test">Voir l’article publié</a></p>
    </section>
  </main>
</body>
</html>
